<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140822"/>
      <stop offset="0.55" stop-color="#2a1145"/>
      <stop offset="1" stop-color="#4a1f73"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#9b5de5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9b5de5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#c9a7ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>

  <!-- звёзды -->
  <g fill="#e9d8ff">
    <circle cx="96" cy="58" r="1.6" opacity="0.7"/>
    <circle cx="214" cy="262" r="1.2" opacity="0.5"/>
    <circle cx="402" cy="44" r="1.4" opacity="0.6"/>
    <circle cx="611" cy="278" r="1.1" opacity="0.5"/>
    <circle cx="742" cy="70" r="1.5" opacity="0.6"/>
    <circle cx="1188" cy="58" r="1.3" opacity="0.6"/>
    <circle cx="1220" cy="250" r="1.6" opacity="0.7"/>
    <circle cx="1056" cy="286" r="1.1" opacity="0.5"/>
    <circle cx="884" cy="38" r="1.2" opacity="0.5"/>
  </g>

  <!-- полумесяц -->
  <g transform="translate(1010 150)">
    <circle r="62" fill="#d9c2ff" opacity="0.92"/>
    <circle r="62" cx="26" cy="-14" fill="#3a1860"/>
  </g>
  <!-- искорки -->
  <g fill="#f3e8ff">
    <path d="M1118 92 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 z" opacity="0.85"/>
